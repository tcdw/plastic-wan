services:
  plasticwan:
    # Build from the checked-out Plastic Wan source tree. This avoids assuming
    # that a remote image tag matches the source version used by these docs.
    build:
      # This file is intended to be copied to the clone root.
      context: .
      dockerfile: Dockerfile
    image: plasticwan:local
    restart: unless-stopped
    environment:
      PLASTICWAN_SUPERVISED: "1"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN outside this file}
      PLASTICWAN_API_KEY: ${PLASTICWAN_API_KEY:?set PLASTICWAN_API_KEY outside this file}
    volumes:
      - ./config:/config
      - ./data:/data
    ports:
      - "127.0.0.1:8787:8787"
